<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profil Pengguna</title><link rel="stylesheet" href="style.css"></head><body>
<div class="mobile-app">
  <div class="status-bar">9:41</div>
  <main class="content">
    <header class="page-header page-header-mb">
      <h1 class="text-heading page-title">Profil Saya</h1>
    </header>

    <section class="profile-summary">
      <div class="profile-avatar profile-avatar-large" aria-label="Profil pengguna">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div>
        <h2 class="text-heading" id="display-nama">User Organisasi</h2>
        <p class="text-body" id="display-email">uisi.event@organisasi.ac.id</p>
      </div>
    </section>
    <hr class="divider">

    <form id="profil-form" onsubmit="return false;">
      <div class="input-group">
        <label for="nama">NAMA ORGANISASI</label>
        <input type="text" id="nama" placeholder="Contoh: BEM Universitas" oninput="cekForm()">
      </div>
      <div class="input-group">
        <label for="kota">KOTA</label>
        <input type="text" id="kota" placeholder="Contoh: Bandar Lampung" oninput="cekForm()">
      </div>
      <div class="input-group">
        <label for="email">EMAIL</label>
        <input type="email" id="email" placeholder="Contoh: uisi.event@organisasi.ac.id" oninput="cekForm()">
      </div>

      <button type="submit" class="btn-primary btn-mt" id="btn-simpan" disabled onclick="simpanProfil()">
        Simpan Profil
        <span class="btn-arrow">→</span>
      </button>
    </form>

    <div class="logout-wrap">
      <a href="index.html" class="logout-link">Keluar</a>
    </div>
  </main>

  <footer class="app-footer">
    <p class="footer-title">Temu Dana</p>
    <p class="footer-desc">Platform pencarian sponsor untuk kegiatan mahasiswa dan komunitas.</p>
    <p class="footer-copy">&copy; 2026 PUA · ISE! Academy 2026</p>
  </footer>

  <nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    Beranda
  </a>
  <a href="profil-acara.html" class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    Cari Sponsor
  </a>
  <a href="riwayat.html" class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    Riwayat
  </a>
  <a href="profil.html" class="nav-item active">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    Profil
  </a>
</nav>
</div>

<script>
  function cekForm() {
    const nama  = document.getElementById('nama').value.trim();
    const kota  = document.getElementById('kota').value.trim();
    const email = document.getElementById('email').value.trim();
    const btn   = document.getElementById('btn-simpan');
    btn.disabled = !(nama && kota && email);
  }

  function simpanProfil() {
    const nama  = document.getElementById('nama').value.trim();
    const email = document.getElementById('email').value.trim();
    document.getElementById('display-nama').textContent  = nama;
    document.getElementById('display-email').textContent = email;
  }
</script>
</body></html>
