<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Temu Dana - Profil Pengguna</title><meta name="description" content="Kelola informasi organisasi dan kontak pengguna Temu Dana."><link rel="icon" href="data:,"><link rel="preload" href="assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body>
<div class="mobile-app">
  <header class="app-header">
    <div class="app-header-inner">
      <a href="index.html" class="brand-link">Temu Dana</a>
      <button type="button" class="menu-toggle" aria-label="Buka navigasi" aria-controls="main-navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <main class="content">
    <header class="page-header page-header-mb">
      <h1 class="text-heading page-title">Profil Saya</h1>
    </header>

    <section class="profile-summary">
      <div class="profile-avatar profile-avatar-large" role="img" aria-label="Profil pengguna">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div>
        <h2 class="text-heading" id="display-nama">User Organisasi</h2>
        <p class="text-body" id="display-email">uisi.event@organisasi.ac.id</p>
      </div>
    </section>
    <hr class="divider">

    <form id="profil-form">
      <div class="input-group">
        <label for="nama">NAMA ORGANISASI</label>
        <input type="text" id="nama" name="nama" placeholder="Contoh: BEM Universitas" autocomplete="organization" required>
      </div>
      <div class="input-group">
        <label for="kota">KOTA</label>
        <input type="text" id="kota" name="kota" placeholder="Contoh: Bandar Lampung" autocomplete="address-level2" required>
      </div>
      <div class="input-group">
        <label for="email">EMAIL</label>
        <input type="email" id="email" name="email" placeholder="Contoh: uisi.event@organisasi.ac.id" autocomplete="email" required>
      </div>

      <button type="submit" class="btn-primary btn-mt" id="btn-simpan" disabled>
        Simpan Profil
        <span class="btn-arrow">→</span>
      </button>
    </form>

    <div class="logout-wrap">
      <a href="index.html" class="logout-link">Keluar</a>
    </div>
  </main>

  <footer class="app-footer">
    <p class="footer-title">Temu Dana</p>
    <p class="footer-desc">Platform pencarian sponsor untuk kegiatan mahasiswa dan komunitas.</p>
    <p class="footer-copy">&copy; 2026 PUA · ISE! Academy 2026</p>
  </footer>

  <nav class="main-nav" id="main-navigation" aria-label="Navigasi utama">
  <a href="index.html" class="nav-item">

    Beranda
  </a>
  <a href="profil-acara.html" class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    Cari Sponsor
  </a>
  <a href="riwayat.html" class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    Riwayat
  </a>
  <a href="profil.html" class="nav-item active" aria-current="page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

</nav>
